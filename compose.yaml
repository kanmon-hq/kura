services:
  kura:
    container_name: kura
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      PORT: 8080
      COST_STORE: ${COST_STORE:-sqlite}
      USAGE_STORE: ${USAGE_STORE:-sqlite}
      SQLITE_PATH: ${SQLITE_PATH:-/data/kura.db}
      COSMOSDB_ENDPOINT: ${COSMOSDB_ENDPOINT:-}
      COSMOSDB_KEY: ${COSMOSDB_KEY:-}
      COSMOSDB_DATABASE: ${COSMOSDB_DATABASE:-kura}
      COSMOSDB_CONTAINER: ${COSMOSDB_CONTAINER:-usage}
      FIRESTORE_PROJECT_ID: ${FIRESTORE_PROJECT_ID:-local-kura-project}
      FIRESTORE_DATABASE: ${FIRESTORE_DATABASE:-(default)}
      FIRESTORE_EMULATOR_HOST: ${FIRESTORE_EMULATOR_HOST:-}
      ADMIN_API_KEY: ${ADMIN_API_KEY:-}
      DEFAULT_TOKEN_QUOTA: 1000000
      MICROSOFT_FOUNDRY_ENDPOINT: ${MICROSOFT_FOUNDRY_ENDPOINT:-http://mock-llm:8090}
      MICROSOFT_FOUNDRY_ENDPOINT_JAPAN: ${MICROSOFT_FOUNDRY_ENDPOINT_JAPAN:-http://mock-llm:8090}
      MICROSOFT_FOUNDRY_API_KEY: ${MICROSOFT_FOUNDRY_API_KEY:-mock-key}
      MICROSOFT_FOUNDRY_API_VERSION: ${MICROSOFT_FOUNDRY_API_VERSION:-2024-02-15-preview}
      MICROSOFT_FOUNDRY_DEFAULT_DEPLOYMENT: ${MICROSOFT_FOUNDRY_DEFAULT_DEPLOYMENT:-gpt-5.4-mini}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      DOCS_PATH: ${DOCS_PATH:-/docs}
      OPENAPI_PATH: ${OPENAPI_PATH:-/openapi}
      # ゲートウェイ共有シークレット (ローカル検証用既定値: INSECURE_NO_GATEWAY_AUTH=true。本番では必ず無効化し GATEWAY_SHARED_SECRET を設定すること)
      GATEWAY_SHARED_SECRET: ${GATEWAY_SHARED_SECRET:-}
      GATEWAY_SHARED_SECRET_PREVIOUS: ${GATEWAY_SHARED_SECRET_PREVIOUS:-}
      GATEWAY_SECRET_HEADER: ${GATEWAY_SECRET_HEADER:-X-Gateway-Secret}
      INSECURE_NO_GATEWAY_AUTH: ${INSECURE_NO_GATEWAY_AUTH:-true}
    volumes:
      - kura-data:/data
    healthcheck:
      test: [ "CMD-SHELL", "wget -q --spider http://localhost:8080/livez || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 5

  mock-llm:
    build:
      context: .
      dockerfile: Dockerfile.mock
    ports:
      - "8090:8090"
    environment:
      - PORT=8090

  dynamodb:
    image: amazon/dynamodb-local:2.4.0
    command: "-jar DynamoDBLocal.jar -sharedDb -inMemory"
    profiles:
      - dynamodb
      - all
    healthcheck:
      test: [ "CMD-SHELL", "curl -s http://localhost:8000/ || exit 0" ]
      interval: 5s
      timeout: 3s
      retries: 5

  dynamodb-admin:
    image: aaronshaf/dynamodb-admin:latest
    ports:
      - "8001:8001"
    environment:
      DYNAMO_ENDPOINT: http://dynamodb:8000
      AWS_REGION: ap-northeast-1
    profiles:
      - dynamodb
      - all
    depends_on:
      - dynamodb

  dynamodb-init:
    image: amazon/aws-cli:latest
    environment:
      AWS_ACCESS_KEY_ID: dummy
      AWS_SECRET_ACCESS_KEY: dummy
      AWS_DEFAULT_REGION: ap-northeast-1
    entrypoint: [ "/bin/sh", "-c" ]
    command:
      - |
        aws dynamodb describe-table --table-name KuraUsage --endpoint-url http://dynamodb:8000 > /dev/null 2>&1 || \
        aws dynamodb create-table \
          --table-name KuraUsage \
          --endpoint-url http://dynamodb:8000 \
          --attribute-definitions \
            AttributeName=pk,AttributeType=S \
            AttributeName=sk,AttributeType=S \
            AttributeName=service_id,AttributeType=S \
            AttributeName=month,AttributeType=S \
          --key-schema \
            AttributeName=pk,KeyType=HASH \
            AttributeName=sk,KeyType=RANGE \
          --global-secondary-indexes \
            '[{"IndexName": "GSI_ServiceUsage", "KeySchema": [{"AttributeName": "service_id", "KeyType": "HASH"}, {"AttributeName": "month", "KeyType": "RANGE"}], "Projection": {"ProjectionType": "ALL"}}]' \
          --billing-mode PAY_PER_REQUEST
    profiles:
      - dynamodb
      - all
    depends_on:
      - dynamodb

  valkey:
    image: valkey/valkey:8-alpine
    container_name: kura-valkey
    ports:
      - "6379:6379"
    command: valkey-server --appendonly yes
    profiles:
      - valkey
      - all
    healthcheck:
      test: [ "CMD", "valkey-cli", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 5

  firestore-emulator:
    image: gcr.io/google.com/cloudsdktool/google-cloud-cli:emulators
    container_name: kura-firestore-emulator
    ports:
      - "8085:8085"
    command: gcloud beta emulators firestore start --host-port=0.0.0.0:8085
    profiles:
      - firestore
      - all
    healthcheck:
      test: [ "CMD-SHELL", "curl -s http://localhost:8085/ || exit 0" ]
      interval: 5s
      timeout: 3s
      retries: 5

  prometheus:
    image: prom/prometheus:latest
    container_name: kura-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./deploy/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    profiles:
      - monitor
      - all
    depends_on:
      - kura

  grafana:
    image: grafana/grafana:latest
    container_name: kura-grafana
    ports:
      - "3000:3000"
    environment:
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
      - GF_AUTH_DISABLE_LOGIN_FORM=true
    volumes:
      - ./deploy/monitoring/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./deploy/monitoring/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./deploy/monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    profiles:
      - monitor
      - all
    depends_on:
      - prometheus

volumes:
  kura-data:

